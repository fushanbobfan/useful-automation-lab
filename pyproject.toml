[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "useful-automation-lab"
version = "1.0.0"
description = "Safe, inspectable utilities for repetitive local tasks"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
file-inventory = "useful_automation_lab.inventory:main"
csv-audit = "useful_automation_lab.csv_audit:main"
env-contract = "useful_automation_lab.env_contract:main"
jsonl-audit = "useful_automation_lab.jsonl_audit:main"
jsonl-event-order-audit = "useful_automation_lab.jsonl_event_order:main"
jsonl-record-diff = "useful_automation_lab.jsonl_record_diff:main"
jsonl-reference-audit = "useful_automation_lab.jsonl_references:main"
jsonl-structure-diff = "useful_automation_lab.jsonl_structure:main"
manifest-diff = "useful_automation_lab.compare:main"
manifest-duplicates = "useful_automation_lab.duplicates:main"
manifest-policy = "useful_automation_lab.policy:main"
manifest-portability = "useful_automation_lab.portability:main"
manifest-verify = "useful_automation_lab.verify:main"
sqlite-audit = "useful_automation_lab.sqlite_audit:main"
sqlite-schema-diff = "useful_automation_lab.sqlite_schema_diff:main"
tar-audit = "useful_automation_lab.tar_audit:main"
text-audit = "useful_automation_lab.text_audit:main"
zip-audit = "useful_automation_lab.zip_audit:main"

[tool.setuptools.packages.find]
where = ["src"]
